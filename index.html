<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Война и тайная любовь — Мурат Орынбасар Темурулы</title>
<meta name="description" content="«Война и тайная любовь» — исторический роман Мурата Орынбасара Темурулы.">
<meta property="og:title" content="Война и тайная любовь">
<meta property="og:description" content="«Война и тайная любовь» — Мурат Орынбасар Темурулы">
<meta property="og:type" content="book">
<style>
  :root { --bg:#ffffff; --paper:#ffffff; --ink:#222; --muted:#8c8c8c; --line:#e6e6e6; --edge:#d9d9d9; }
  body[data-t="sepia"] { --bg:#efe6d2; --paper:#f8f1e0; --ink:#3b2f22; --muted:#95866f; --line:#e2d6bb; --edge:#d3c4a3; }
  body[data-t="dark"]  { --bg:#16171a; --paper:#1e2024; --ink:#c9c9c6; --muted:#6f7076; --line:#2c2e33; --edge:#33363c; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { height:100dvh; display:flex; flex-direction:column; align-items:center; background:var(--bg); color:var(--ink);
         font-family:Georgia,"Times New Roman",serif; transition:background .2s,color .2s; overflow:hidden; }
  button, input { font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }

  .top { width:100%; display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 16px; padding-top:max(10px,env(safe-area-inset-top)); font:14px system-ui,sans-serif; color:var(--muted); }
  #name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .tools { display:flex; gap:6px; flex-shrink:0; }
  .tools button { font-size:13px; min-width:34px; height:32px; padding:0 10px; color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:8px; cursor:pointer; }
  .tools button:hover { border-color:var(--muted); }

  .stage { flex:1; min-height:0; width:100%; display:flex; align-items:center; justify-content:center; gap:8px; }
  .arrow { font-size:26px; line-height:1; color:var(--muted); background:none; border:0; cursor:pointer; padding:14px 10px; border-radius:10px; flex-shrink:0; }
  .arrow:hover:not(:disabled) { color:var(--ink); background:var(--line); }
  .arrow:disabled { opacity:.2; cursor:default; }

  .book { position:relative; background:var(--paper); border:1px solid var(--edge); border-radius:4px; cursor:pointer; flex-shrink:0;
          box-shadow:0 1px 2px rgba(0,0,0,.05), 0 10px 28px -12px rgba(0,0,0,.18); -webkit-tap-highlight-color:transparent; }
  .book.two::after { content:""; position:absolute; top:0; bottom:0; left:calc(50% - 26px); width:52px; pointer-events:none;
          background:linear-gradient(to right, transparent, rgba(0,0,0,.07) 50%, transparent); }
  body[data-t="dark"] .book.two::after { background:linear-gradient(to right, transparent, rgba(0,0,0,.35) 50%, transparent); }
  .clip { overflow:hidden; }
  .flow { column-fill:auto; line-height:1.55; text-align:justify; hyphens:auto; -webkit-hyphens:auto; text-wrap:pretty; transition:transform .28s cubic-bezier(.3,.7,.2,1); }
  @media (prefers-reduced-motion:reduce) { .flow { transition:none; } }

  .flow h1 { font-size:1.55em; line-height:1.25; font-weight:normal; text-align:center; hyphens:manual; margin:0 0 .5em; padding-top:.8em; break-before:column; }
  .flow h1:first-child { break-before:auto; }
  .flow h1::after { content:""; display:block; width:2.2em; height:1px; background:var(--muted); margin:.5em auto 0; }
  .flow h2 { font-size:1.2em; font-weight:normal; text-align:center; margin:1.6em 0 .7em; break-after:avoid; }
  .flow h3 { font-size:1em; font-style:italic; font-weight:normal; margin:1.3em 0 .4em; break-after:avoid; }
  .flow p { margin:0; text-indent:1.25em; orphans:2; widows:2; }
  .flow h1 + p, .flow h2 + p, .flow h3 + p, .flow hr + p, .flow blockquote + p { text-indent:0; }
  .flow blockquote { margin:.9em 0; padding-left:1em; border-left:2px solid var(--line); font-style:italic; break-inside:avoid; }
  .flow ul, .flow ol { margin:.8em 0; padding-left:1.3em; }
  .flow figure { margin:.6em 0 .2em; text-align:center; break-inside:avoid; }
  .flow img { max-width:100%; max-height:min(38vh, 290px); height:auto; border-radius:4px; display:block; margin:0 auto; box-shadow:0 4px 16px rgba(0,0,0,.2); }
  .flow figcaption { font-size:0.85em; font-style:italic; color:var(--muted); margin-top:0.3em; text-align:center; }
  .flow figure + p { text-indent:0; text-align:center; font-size:0.82em; font-style:italic; color:var(--muted); margin-top:0.2em; margin-bottom:.6em; }
  .flow figure + p + p { break-before:column; }
  .flow code { font-family:ui-monospace,Menlo,monospace; font-size:.88em; background:var(--line); padding:0 .25em; border-radius:3px; }

  .foot { width:100%; max-width:560px; padding:6px 20px calc(10px + env(safe-area-inset-bottom)); text-align:center; font:12.5px system-ui,sans-serif; color:var(--muted); }
  #seek { width:100%; margin:6px 0 0; height:18px; accent-color:var(--ink); cursor:pointer; background:transparent; }

  body.drag .book { outline:2px dashed var(--muted); outline-offset:8px; }
  input[type=file] { display:none; }
  button:focus-visible, #seek:focus-visible { outline:2px solid var(--muted); outline-offset:2px; }
  @media (max-width:699px) { .arrow { display:none; } .stage { gap:0; } }
</style>
</head>
<body data-t="light">

<div class="top" id="top">
  <span id="name"></span>
  <div class="tools">
    <button id="to-start" type="button">В начало</button>
    <button id="fm" type="button" aria-label="Уменьшить шрифт">A&minus;</button>
    <button id="fp" type="button" aria-label="Увеличить шрифт">A+</button>
    <button id="th" type="button" aria-label="Сменить тему">Тема</button>
    <button id="open" type="button">Открыть .md</button>
    <input id="file" type="file" accept=".md,.markdown,.txt,text/markdown,text/plain">
  </div>
</div>

<div class="stage" id="stage">
  <button class="arrow" id="prev" type="button" aria-label="Назад">&larr;</button>
  <div class="book" id="book"><div class="clip" id="clip"><div class="flow" id="flow"></div></div></div>
  <button class="arrow" id="next" type="button" aria-label="Вперёд">&rarr;</button>
</div>

<div class="foot" id="foot"><span id="pos"></span><input id="seek" type="range" min="0" max="0" value="0" aria-label="Перейти к странице"></div>

<!-- Текст книги: замени markdown между тегами на свой. Либо открой файл кнопкой сверху. -->
<script type="text/markdown" id="source">
# Название книги

Здесь будет текст твоей книги. Нажми «Открыть .md» вверху или перетащи файл на страницу, и книга заменится.

Листать можно стрелками на клавиатуре, кнопками по бокам, кликом по правой или левой части книги, а на телефоне свайпом. Внизу есть ползунок для быстрого перехода.

## Как вставить книгу прямо в файл

Открой этот HTML в текстовом редакторе, найди блок с текстом и замени содержимое на свой markdown. Тогда книга будет открываться сразу.

# Вторая глава

Каждый заголовок первого уровня начинает новую страницу. Заголовки второго и третьего уровня идут внутри страницы.

> Цитата выглядит так.

Можно писать **жирным**, *курсивом* и `кодом`.

---

- список
- из нескольких
- пунктов
</script>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var flow = $('flow'), clip = $('clip'), book = $('book'), seek = $('seek');
  var page = 0, pages = 1, cols = 1, step = 0, pos = 0, key = 'book', raw = $('source').textContent.trim();
  var fs = 1, themes = ['light', 'sepia', 'dark'], ti = 0, RATIO = 148 / 210; // A5

  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function fetchv(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  fs = parseFloat(fetchv('book-fs')) || 1;
  ti = Math.max(0, themes.indexOf(fetchv('book-theme')));
  document.body.dataset.t = themes[ti];

  // ---------- markdown -> html ----------
  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function inline(s) {
    return esc(s)
      .replace(/!\[(.*?)\]\((.*?)\)/g, '<img src="$2" alt="$1">')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*\w])\*([^*\n]+)\*/g, '$1<em>$2</em>')
      .replace(/(^|[^\w])_([^_\n]+)_/g, '$1<em>$2</em>');
  }
  function md(src) {
    var out = [], para = [], list = null, quote = [];
    function flushP() { if (para.length) { out.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; } }
    function flushL() { if (list) { out.push('<' + list.t + '>' + list.i.join('') + '</' + list.t + '>'); list = null; } }
    function flushQ() { if (quote.length) { out.push('<blockquote>' + inline(quote.join(' ')) + '</blockquote>'); quote = []; } }
    function flush() { flushP(); flushL(); flushQ(); }
    src.replace(/\r\n?/g, '\n').split('\n').forEach(function (line) {
      var m;
      if (!line.trim()) { flush(); return; }
      if ((m = line.match(/^!\[(.*?)\]\((.*?)\)$/))) {
        flush();
        var alt = m[1], isrc = m[2].trim();
        out.push('<figure><img src="' + esc(isrc) + '" alt="' + esc(alt) + '"></figure>');
        return;
      }
      if ((m = line.match(/^(#{1,3})\s+(.*)$/))) { flush(); out.push('<h' + m[1].length + '>' + inline(m[2]) + '</h' + m[1].length + '>'); return; }
      if (/^\s*([-*_])\1{2,}\s*$/.test(line)) { flush(); out.push('<hr>'); return; }
      if ((m = line.match(/^>\s?(.*)$/))) { flushP(); flushL(); quote.push(m[1]); return; }
      if ((m = line.match(/^\s*([-*+]|\d+\.)\s+(.*)$/))) {
        flushP(); flushQ();
        var t = /\d/.test(m[1]) ? 'ol' : 'ul';
        if (!list || list.t !== t) { flushL(); list = { t: t, i: [] }; }
        list.i.push('<li>' + inline(m[2]) + '</li>'); return;
      }
      flushL(); flushQ(); para.push(line.trim());
    });
    flush();
    return out.join('\n');
  }

  // ---------- вёрстка: страницы пропорций А5 ----------
  function layout() {
    var w = window.innerWidth, h = window.innerHeight;
    var avail = h - $('top').offsetHeight - $('foot').offsetHeight - 14;
    var side = w >= 700 ? 130 : 16;
    cols = (w >= 960 && w / h > 1.25) ? 2 : 1;
    var maxW = (w - side) / cols, byH = avail * RATIO, pageW, pageH;
    if (maxW < byH) { pageW = maxW; pageH = cols === 1 ? avail : maxW / RATIO; }
    else { pageW = byH; pageH = avail; }
    pageW = Math.floor(pageW); pageH = Math.floor(pageH);
    var m = Math.round(Math.max(22, Math.min(60, pageW * 0.1)));
    var colW = pageW - 2 * m, gap = 2 * m, H = pageH - 2 * m;
    var W = cols * colW + (cols - 1) * gap;
    book.style.padding = m + 'px';
    book.classList.toggle('two', cols === 2);
    clip.style.width = flow.style.width = W + 'px';
    clip.style.height = flow.style.height = H + 'px';
    flow.style.columnWidth = colW + 'px'; flow.style.columnGap = gap + 'px';
    flow.style.fontSize = (Math.max(14.5, Math.min(17.5, pageW * 0.03)) * fs).toFixed(2) + 'px';
    step = cols * (colW + gap);
    var total = Math.max(1, Math.round((flow.scrollWidth + gap) / (colW + gap)));
    pages = Math.max(1, Math.ceil(total / cols));
    page = Math.round(pos * (pages - 1));
    show();
  }
  function show() {
    flow.style.transform = 'translateX(' + (-page * step) + 'px)';
    var a = page * cols + 1, b = (page + 1) * cols;
    $('pos').textContent = (cols === 2 ? a + '\u2013' + b : a) + ' / ' + pages * cols;
    seek.max = Math.max(0, pages - 1); seek.value = page;
    $('prev').disabled = page === 0; $('next').disabled = page >= pages - 1;
  }
  function setPage(p) {
    p = Math.max(0, Math.min(pages - 1, p));
    if (p === page) return;
    page = p; pos = pages > 1 ? page / (pages - 1) : 0;
    store(key, pos); show();
  }

  function load(text, name, restore) {
    raw = text; flow.innerHTML = md(text);
    var h1 = flow.querySelector('h1');
    var firstLine = text.trim().split('\n')[0].replace(/^#+\s*/, '').replace(/\.$/, '').trim();
    var title = name || (firstLine ? firstLine : (h1 ? h1.textContent : 'Война и тайная любовь'));
    document.title = title; $('name').textContent = title;
    key = 'book-pos:' + title;
    pos = restore ? (parseFloat(fetchv(key)) || 0) : 0;
    layout();
    var imgs = flow.querySelectorAll('img');
    for (var i = 0; i < imgs.length; i++) {
      if (!imgs[i].complete) {
        imgs[i].onload = imgs[i].onerror = function () { layout(); };
      }
    }
  }

  // ---------- управление ----------
  $('next').onclick = function () { setPage(page + 1); };
  $('prev').onclick = function () { setPage(page - 1); };
  book.addEventListener('click', function (e) {
    var r = book.getBoundingClientRect(); setPage(page + (e.clientX > r.left + r.width / 2 ? 1 : -1));
  });
  document.addEventListener('keydown', function (e) {
    if (e.target === seek) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); setPage(page + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); setPage(page - 1); }
    else if (e.key === 'Home') setPage(0);
    else if (e.key === 'End') setPage(pages - 1);
  });
  seek.oninput = function () { setPage(parseInt(seek.value, 10)); };
  var sx = null;
  book.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; }, { passive: true });
  book.addEventListener('touchend', function (e) {
    if (sx === null) return;
    var dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) > 40) { setPage(page + (dx < 0 ? 1 : -1)); e.preventDefault(); }
  });

  function setFs(v) { fs = Math.max(0.8, Math.min(1.5, v)); store('book-fs', fs); layout(); }
  $('to-start').onclick = function () { setPage(0); };
  $('fm').onclick = function () { setFs(fs - 0.08); };
  $('fp').onclick = function () { setFs(fs + 0.08); };
  $('th').onclick = function () { ti = (ti + 1) % themes.length; document.body.dataset.t = themes[ti]; store('book-theme', themes[ti]); };

  function readFile(f) { if (f) f.text().then(function (t) { load(t, f.name.replace(/\.\w+$/, ''), false); }); }
  $('open').onclick = function () { $('file').click(); };
  $('file').onchange = function () { readFile(this.files[0]); this.value = ''; };
  ['dragenter', 'dragover'].forEach(function (ev) { document.addEventListener(ev, function (e) { e.preventDefault(); document.body.classList.add('drag'); }); });
  ['dragleave', 'drop'].forEach(function (ev) { document.addEventListener(ev, function (e) { e.preventDefault(); document.body.classList.remove('drag'); }); });
  document.addEventListener('drop', function (e) { readFile(e.dataTransfer.files[0]); });

  var t; window.addEventListener('resize', function () { clearTimeout(t); t = setTimeout(layout, 120); });
  // Сначала пробуем подгрузить book.md из той же папки (работает на GitHub Pages / любом сервере).
  // Если файла нет или страница открыта локально с диска, показываем текст, вшитый в этот HTML.
  var ready = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  ready.then(function () {
    return fetch('book.md?v=' + Date.now(), { cache: 'no-store' }).then(function (r) { if (!r.ok) throw 0; return r.text(); }).catch(function () { return raw; });
  }).then(function (text) { load(text, '', true); });
})();
</script>
</body>
</html>
